name: Build & Deploy JD Connect

# Trigger on every push to main
on:
  push:
    branches: [main]

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 0: Quality Gate — lint, typecheck, test, build
  # ───────────────────────────────────────────────────────────────────────────
  quality-check:
    name: Quality Check (Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jdconnect_test
          POSTGRES_USER: jduser_ci
          POSTGRES_PASSWORD: jdpassword_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U jduser_ci -d jdconnect_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install monorepo dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://jduser_ci:jdpassword_ci@127.0.0.1:5432/jdconnect_test
          JWT_SECRET: ci-quality-test-jwt-secret-32-chars!!

      - name: Build
        run: pnpm build

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: Build Backend API Docker image → push to GHCR
  # ───────────────────────────────────────────────────────────────────────────
  build-backend:
    name: Build Backend API Image
    runs-on: ubuntu-latest
    needs: quality-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase repository name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Backend API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_LOWER }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: Build Attendance App Docker image → push to GHCR
  # ───────────────────────────────────────────────────────────────────────────
  build-attendance-app:
    name: Build Attendance App Image
    runs-on: ubuntu-latest
    needs: quality-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase repository name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Attendance App image
        uses: docker/build-push-action@v5
        with:
          context: attendance-app
          file: attendance-app/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_LOWER }}/attendance-app:latest
          # PROD_BACKEND_URL GitHub Secret (e.g. https://api.yourdomain.com)
          build-args: |
            BACKEND_URL=${{ secrets.PROD_BACKEND_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3: Build HR Dashboard Docker image → push to GHCR
  # ───────────────────────────────────────────────────────────────────────────
  build-hr-dashboard:
    name: Build HR Dashboard Image
    runs-on: ubuntu-latest
    needs: quality-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase repository name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push HR Dashboard image
        uses: docker/build-push-action@v5
        with:
          context: hr-dashboard
          file: hr-dashboard/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_LOWER }}/hr-dashboard:latest
          build-args: |
            BACKEND_URL=${{ secrets.PROD_BACKEND_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 4: Deploy to VPS
  # Runs only after all three images have been built and pushed successfully.
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build-backend, build-attendance-app, build-hr-dashboard]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase repository name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      # Copy ONLY the compose file to the VPS (no source code needed there)
      - name: Copy docker-compose.prod.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker/docker-compose.prod.yml"
          target: "/opt/jdconnect/"
          strip_components: 1   # Strips "docker/" prefix → lands at /opt/jdconnect/docker-compose.prod.yml

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: REPO_LOWER
          script: |
            set -e

            # ── Write the .env file from GitHub Secrets (safe to overwrite every deploy) ──
            cat > /opt/jdconnect/.env << 'ENVEOF'
            REPO_LOWER=${{ env.REPO_LOWER }}
            DOMAIN=${{ secrets.PROD_DOMAIN }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            ZULIP_BASE_URL=${{ secrets.ZULIP_BASE_URL }}
            ZULIP_BOT_EMAIL=${{ secrets.ZULIP_BOT_EMAIL }}
            ZULIP_BOT_API_KEY=${{ secrets.ZULIP_BOT_API_KEY }}
            HR_DASHBOARD_URL=${{ secrets.HR_DASHBOARD_URL }}
            CLOCK_APP_URL=${{ secrets.CLOCK_APP_URL }}
            ALLOWED_CORS_ORIGINS=${{ secrets.ALLOWED_CORS_ORIGINS }}
            ENVEOF

            cd /opt/jdconnect

            # ── Log into GHCR to pull images ──
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # ── Pull the freshly built images ──
            docker pull ghcr.io/$REPO_LOWER/backend:latest
            docker pull ghcr.io/$REPO_LOWER/attendance-app:latest
            docker pull ghcr.io/$REPO_LOWER/hr-dashboard:latest

            # ── Restart app containers (Postgres is NOT touched if already healthy) ──
            docker compose -f docker-compose.prod.yml up -d --no-deps api attendance-app hr-dashboard

            # ── Run database migrations (idempotent — safe to run every deploy) ──
            sleep 8
            docker exec jdconnect_api tsx scripts/migrate.ts

            # ── Clean up old unused images to free VPS disk space ──
            docker image prune -f

            echo "✅ JD Connect deployed successfully!"

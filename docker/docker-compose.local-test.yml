# docker/docker-compose.local-test.yml
# ─────────────────────────────────────────────────────────────────────────────
# LOCAL DOCKER IMAGE TEST — No HTTPS, no Traefik, no external dependencies.
#
# Purpose: Verify that both Docker images build and run correctly
# BEFORE pushing to production. This is the local equivalent of Phase 2.
#
# IMPORTANT:
#   - This uses DIFFERENT ports so it runs alongside your dev servers (no conflict).
#   - Zulip SSO will NOT work (requires HTTPS + matching domain). That's expected.
#   - JWT login, clock-in, clock-out, dashboard, employees page — everything else works fine.
#   - Your existing local Zulip (127.0.0.1:9991) is still used by the Backend API.
#
# HOW TO RUN (from the repo root — --project-name flag is REQUIRED):
#   docker compose --project-name jdconnect-test --env-file .env -f docker/docker-compose.local-test.yml up -d --build
#
# HOW TO STOP AND CLEAN UP:
#   docker compose --project-name jdconnect-test -f docker/docker-compose.local-test.yml down
#
# ACCESS (while running):
#   Backend API health:  http://localhost:4001/health
#   Unified Portal:      http://localhost:3201
#
# FIRST TIME SETUP (after first `up --build`):
#   Run migrations and seed from the repo root:
#     pnpm db:migrate
#     pnpm db:seed
# ─────────────────────────────────────────────────────────────────────────────

networks:
  jdconnect_local_test:
    driver: bridge

volumes:
  pgdata_local_test:

services:

  # ── JD Connect Postgres (test instance — isolated from dev Postgres) ──────
  postgres:
    image: postgres:16-alpine
    container_name: jdconnect_test_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jdconnect
      POSTGRES_USER: jduser
      POSTGRES_PASSWORD: jdpassword
    volumes:
      - pgdata_local_test:/var/lib/postgresql/data
    networks:
      - jdconnect_local_test
    # Port 5433 to avoid conflict with dev Postgres on 5432
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jduser -d jdconnect"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Backend API — built from source, NOT pulled from GHCR ────────────────
  api:
    build:
      context: ..             # Monorepo root (Dockerfile needs pnpm workspace context)
      dockerfile: backend/Dockerfile
    container_name: jdconnect_test_api
    restart: unless-stopped
    ports:
      - "4001:4000"           # 4001 avoids conflict with dev backend on 4000
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://jduser:jdpassword@host.docker.internal:5432/jdconnect

      JWT_SECRET: local-docker-test-jwt-secret-32-chars!!
      JWT_EXPIRATION: 15m

      # host.docker.internal resolves to the Windows host machine from inside Docker.
      # This lets the containerised backend reach your locally running Zulip (127.0.0.1:9991).
      ZULIP_BASE_URL: https://host.docker.internal:9991
      ZULIP_BOT_EMAIL: jdconnect-bot@company.com
      # Injected from root .env via --env-file flag. Run with:
      #   docker compose --project-name jdconnect-test --env-file .env -f docker/docker-compose.local-test.yml up -d --build
      ZULIP_BOT_API_KEY: ${ZULIP_BOT_API_KEY:-replace-with-your-bot-api-key}
      ZULIP_ATTENDANCE_STREAM: attendance

      # Portal URL as the browser sees it (host machine port)
      PORTAL_URL: http://localhost:3201
      BACKEND_URL: http://localhost:4001
      ALLOWED_CORS_ORIGINS: http://localhost:3201,https://127.0.0.1:9991

      # Required: accept Zulip's self-signed cert for internal API calls.
      # (Safe here — this is dev-only. Never set this in production.)
      NODE_TLS_REJECT_UNAUTHORIZED: "0"

    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jdconnect_local_test
    extra_hosts:
      # Makes host.docker.internal resolve correctly on all platforms including Linux
      - "host.docker.internal:host-gateway"

  # ── Unified Portal — multi-stage esbuild + nginx ──────────────────────────
  # Replaces both attendance-app and hr-dashboard.
  # Stage 1: node:20-alpine installs pnpm deps and runs `node build.mjs`
  # Stage 2: nginx:alpine serves the compiled dist/ and reverse-proxies /api/*
  #          to the backend container (no CORS, no URL baking into the JS bundle)
  portal:
    build:
      context: ..             # Monorepo root — needed for pnpm workspace install
      dockerfile: portal/Dockerfile
      args:
        # Internal Docker network URL — nginx uses this to proxy /api/* to the backend.
        # The browser never sees this URL; it only ever calls /api/... on the same origin.
        BACKEND_INTERNAL_URL: http://api:4000
    container_name: jdconnect_test_portal
    restart: unless-stopped
    ports:
      - "3201:80"             # 3201 avoids conflict with dev portal on 3200
    depends_on:
      - api
    networks:
      - jdconnect_local_test

# Disable gzip so sub_filter can read & modify the response body
gzip off;

# Allow sub_filter to operate on HTML responses (and any other type if needed)
sub_filter_types text/html;

# Inject our custom CSS just before </body>
sub_filter '</body>' '<link rel="stylesheet" type="text/css" href="/static/custom.css"></body>';
sub_filter_once on;

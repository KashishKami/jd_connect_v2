# Disable gzip so sub_filter can read & modify the response body
gzip off;

# Allow sub_filter to operate on HTML responses
sub_filter_types text/html;

# Inject our custom CSS + the persistent Portal button just before </body>.
#
# ── Portal URL ───────────────────────────────────────────────────────────────
# Local dev / local Docker test:  http://localhost:3201
# VPS Phase 2:                    http://<VPS_IP>:3201
# VPS Phase 3 (production):       https://portal.yourdomain.com
#
# Update the href below when deploying to a new environment.
# ─────────────────────────────────────────────────────────────────────────────
sub_filter '</body>' '<link rel="stylesheet" type="text/css" href="/static/custom.css"><a id="jdconnect-portal-btn" href="YOUR_PORTAL_URL" target="_blank" rel="noopener noreferrer" title="Open JD Connect Attendance Portal"><span class="jd-btn-icon">&#128197;</span><span class="jd-btn-label">Attendance</span></a></body>';
sub_filter_once on;

services:
  # ==========================================
  # 1. PostgreSQL Database Container (Dev & Test DBs)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: jdconnect_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: jdconnect
      POSTGRES_USER: jduser
      POSTGRES_PASSWORD: jdpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - jdconnect_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jduser -d jdconnect"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. PostgreSQL Database Container (Zulip DB)
  # ==========================================
  zulip-postgres:
    image: postgres:16-alpine
    container_name: jdconnect_zulip_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zulip
      POSTGRES_USER: zulip
      POSTGRES_PASSWORD: zulipdevpostgrespassword
    volumes:
      - zulipdbdata:/var/lib/postgresql/data
    networks:
      - jdconnect_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zulip -d zulip"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 3. Redis Cache Container (for Zulip rate limiting & sessions)
  # ==========================================
  zulip-redis:
    image: redis:7-alpine
    container_name: jdconnect_zulip_redis
    command: redis-server --requirepass zulipdevredispassword
    restart: unless-stopped
    networks:
      - jdconnect_network

  # ==========================================
  # 4. Memcached Container (for Zulip caching)
  # ==========================================
  zulip-memcached:
    image: memcached:alpine
    container_name: jdconnect_zulip_memcached
    restart: unless-stopped
    networks:
      - jdconnect_network

  # ==========================================
  # 5. RabbitMQ Container (for Zulip event queue)
  # ==========================================
  zulip-rabbitmq:
    image: rabbitmq:3-alpine
    container_name: jdconnect_zulip_rabbitmq
    restart: unless-stopped
    networks:
      - jdconnect_network

  # ==========================================
  # 6. Zulip Chat Platform Container
  # ==========================================
  zulip:
    image: zulip/docker-zulip:latest
    container_name: jdconnect_zulip
    restart: unless-stopped
    ports:
      - "9991:443"
    environment:
      - DB_HOST=zulip-postgres
      - DB_USER=zulip
      - DB_NAME=zulip
      - SETTING_EXTERNAL_HOST=127.0.0.1:9991
      - SETTING_ZULIP_ADMINISTRATOR=admin@company.com
      - SETTING_POSTGRES_HOST=zulip-postgres
      - SETTING_POSTGRES_USER=zulip
      - SETTING_POSTGRES_DB=zulip
      - SETTING_REDIS_HOST=zulip-redis
      - SETTING_MEMCACHED_LOCATION=zulip-memcached:11211
      - SETTING_RABBITMQ_HOST=zulip-rabbitmq
      - SECRETS_email_password=zulipdevpassword
      - SECRETS_postgres_password=zulipdevpostgrespassword
      - SECRETS_redis_password=zulipdevredispassword
      - SECRETS_secret_key=zulipdevsecretkey32charsminimum
      - SETTING_EMAIL_HOST=
      - SETTING_EMAIL_HOST_USER=
      - CERTIFICATES=self-signed
      - TRUST_GATEWAY_IP=True
    depends_on:
      zulip-postgres:
        condition: service_healthy
      zulip-redis:
        condition: service_started
      zulip-memcached:
        condition: service_started
      zulip-rabbitmq:
        condition: service_started
    volumes:
      - zulipdata:/data
    networks:
      - jdconnect_network

networks:
  jdconnect_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  zulipdata:
    driver: local
  zulipdbdata:
    driver: local


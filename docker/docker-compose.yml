services:
  # ==========================================
  # 1. PostgreSQL Database Container (Dev & Test DBs)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: jdconnect_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: jdconnect
      POSTGRES_USER: jduser
      POSTGRES_PASSWORD: jdpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - jdconnect_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jduser -d jdconnect"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  jdconnect_network:
    driver: bridge

volumes:
  pgdata:
    driver: local

# docker/docker-compose.vps-test.yml
# ─────────────────────────────────────────────────────────────────────────────
# Phase 2: VPS IP TEST — Direct port exposure, NO Traefik, NO SSL.
# Use this to verify all containers boot and communicate correctly on the VPS
# before pointing your real domain and enabling HTTPS.
#
# Access after deploying:
#   Backend API:  http://<VPS_IP>:4000
#   Portal:       http://<VPS_IP>:3201
#   Zulip:        https://<VPS_IP>:9991  (its own self-signed cert — accept warning)
#
# NOTE: Zulip is managed by its own separate compose stack in /opt/jdconnect_v2/zulip/
# ─────────────────────────────────────────────────────────────────────────────

networks:
  jdconnect_net:
    driver: bridge
    name: jdconnect_net_test

volumes:
  pgdata_test:

services:

  # ── JD Connect Postgres ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: jdconnect_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jdconnect
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    networks:
      - jdconnect_net
    # Postgres NOT exposed to host in any phase — internal only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d jdconnect"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Backend API ───────────────────────────────────────────────────────────
  api:
    image: ghcr.io/${REPO_LOWER}/backend:latest
    container_name: jdconnect_api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/jdconnect
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 15m
      ZULIP_BASE_URL: ${ZULIP_BASE_URL}
      # ZULIP_HOST_OVERRIDE: Django's ALLOWED_HOSTS check validates the HTTP Host header.
      # When the backend calls Zulip via the VPS IP (e.g. https://82.x.x.x:9991), the Host
      # header is "82.x.x.x:9991". Zulip's ALLOWED_HOSTS may not include the raw IP —
      # set this to the value Zulip is configured with (SETTING_EXTERNAL_HOST) to fix it.
      # Example: ZULIP_HOST_OVERRIDE: 82.29.165.21:9991
      ZULIP_HOST_OVERRIDE: ${VPS_IP}:9991
      ZULIP_BOT_EMAIL: ${ZULIP_BOT_EMAIL}
      ZULIP_BOT_API_KEY: ${ZULIP_BOT_API_KEY}
      ZULIP_ATTENDANCE_STREAM: attendance
      CLOCK_APP_URL: http://${VPS_IP}:3201
      ALLOWED_CORS_ORIGINS: http://${VPS_IP}:3201,https://${VPS_IP}:9991
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jdconnect_net

  # ── Portal (HR Dashboard + Attendance Clock — unified app) ────────────────
  portal:
    image: ghcr.io/${REPO_LOWER}/portal:latest
    container_name: jdconnect_portal
    restart: unless-stopped
    ports:
      - "3201:80"
    networks:
      - jdconnect_net
